name: Fallow Audit

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-node's pnpm cache requires pnpm to already be on PATH.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # Temporary until the updated pnpm-lock.yaml is committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Fallow Audit
        run: pnpm exec fallow audit --ci --fail-on-issues
